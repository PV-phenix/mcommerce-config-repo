#v-Dserver.port=9002,9012
server.port=9002
management.endpoints.web.exposure.include=refresh

#Configurations H2
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.jpa.defer-datasource-initialization=true

#Kafka
kafka.producer.bootstrap-servers: localhost:9092
kafka.producer.key-serializer: org.apache.kafka.common.serialization.StringSerializer
kafka.producer.value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
kafka.producer.properties.kafka.producer.spring.json.type.mapping: commandeConfirmation:com.mcommandes.kafka.CommandeConfirmation

#Eureka
eureka.client.serviceUrl.defaultZone:http://localhost:8761/eureka/

#swagger3 
springdoc.api-docs.path=/api-docs
